name: Controlli

on:
  push:
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm ci
      - name: Sintassi e test
        run: npm run check
